name: Signed plugin integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signed-plugin-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify signed released plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
          cache: false

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2

      - name: Install checker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep

      - name: Verify signatures and reproducible artifacts
        run: ./check-released-plugins.sh

      - name: Check out current Stado host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: foobarto/stado
          path: .tmp/stado

      - name: Build Stado bundled wasm
        working-directory: .tmp/stado
        run: bash plugins/bundled/build.sh

      - name: Verify every released plugin against the current host ABI
        run: |
          set -euo pipefail
          mapfile -t released < <(
            jq -r '.plugins[] | select(.status == "released") | .path' \
              plugin-inventory.json | LC_ALL=C sort
          )
          if [ "${#released[@]}" -eq 0 ]; then
            echo "::error::released-plugin inventory is empty"
            exit 1
          fi
          plugin_dirs=()
          for plugin in "${released[@]}"; do
            plugin_dirs+=("${GITHUB_WORKSPACE}/${plugin}/dist")
          done
          cd .tmp/stado
          go run ./cmd/stado plugin abi-check "${plugin_dirs[@]}"
